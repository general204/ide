<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>León IDE · Editor de código móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eceef6; --border:#dfe2ee;
  --text:#1a1e30; --muted:#7a8199; --accent:#5b52f0; --accent2:#e0709a; --accent-ink:#ffffff;
  --danger:#d6334f; --warn:#b7791f; --ok:#1f9d6b; --caret:#5b52f0; --shadow:0 10px 40px rgba(20,24,50,.18);
  --s-k:#8a3fd1; --s-s:#2a8a45; --s-c:#9aa2b8; --s-n:#c25b12; --s-f:#1c6cc4; --s-t:#d02f5a;
  --s-a:#a56a00; --s-p:#0e8a78; --s-o:#7b829b; --s-v:#33415f; --s-g:#9a4bb5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1120; --surface:#141829; --surface2:#1c2135; --border:#262c45;
    --text:#e7eaf6; --muted:#7d86a6; --accent:#8f9bff; --accent2:#ff8fb1; --accent-ink:#0e1120;
    --danger:#ff6b86; --warn:#f2c46b; --ok:#5fd6a2; --caret:#a9b3ff; --shadow:0 10px 40px rgba(0,0,0,.55);
    --s-k:#c792ea; --s-s:#a8e08a; --s-c:#5b6486; --s-n:#f6a66b; --s-f:#82b8ff; --s-t:#ff7b9c;
    --s-a:#ffd07a; --s-p:#7fdcc8; --s-o:#8b94b8; --s-v:#cfd5ee; --s-g:#d8a6f0;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#141829; --surface2:#1c2135; --border:#262c45;
  --text:#e7eaf6; --muted:#7d86a6; --accent:#8f9bff; --accent2:#ff8fb1; --accent-ink:#0e1120;
  --danger:#ff6b86; --warn:#f2c46b; --ok:#5fd6a2; --caret:#a9b3ff; --shadow:0 10px 40px rgba(0,0,0,.55);
  --s-k:#c792ea; --s-s:#a8e08a; --s-c:#5b6486; --s-n:#f6a66b; --s-f:#82b8ff; --s-t:#ff7b9c;
  --s-a:#ffd07a; --s-p:#7fdcc8; --s-o:#8b94b8; --s-v:#cfd5ee; --s-g:#d8a6f0;
}
:root{ --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); overflow:hidden;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; cursor:pointer; }
#root{ height:var(--app-h,100%); display:flex; flex-direction:column; min-height:0; }

/* Top bar */
.top{ display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border-bottom:1px solid var(--border); }
.logo{ flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); letter-spacing:-.02em; }
.seg{ flex:1; min-width:0; display:flex; gap:2px; padding:3px; background:var(--surface2); border-radius:11px; }
.seg button{ flex:1; min-width:0; border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:500; padding:7px 4px;
  border-radius:8px; display:flex; align-items:center; justify-content:center; gap:5px; position:relative; white-space:nowrap; transition:background .15s,color .15s; }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.badge{ min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:grid; place-items:center; }
.run{ flex:none; height:34px; padding:0 12px; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:6px; }
.run:active{ transform:scale(.97); }
.run .lbl{ display:none; }
.ibtn{ flex:none; width:34px; height:34px; border-radius:10px; border:0; background:transparent; color:var(--muted); display:grid; place-items:center; }
.ibtn:hover{ background:var(--surface2); color:var(--text); }
@media (max-width:420px){ .seg svg{ display:none; } }
@media (min-width:520px){ .run .lbl{ display:inline; } }

/* Tabs */
.tabs{ display:flex; gap:4px; padding:6px 10px 0; overflow-x:auto; scrollbar-width:none; background:var(--bg); border-bottom:1px solid var(--border); flex:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ flex:none; display:flex; align-items:center; gap:7px; padding:7px 11px; border:0; border-bottom:2px solid transparent; border-radius:9px 9px 0 0;
  background:transparent; color:var(--muted); font:500 12.5px var(--mono); }
.tab.on{ color:var(--text); background:var(--surface); border-bottom-color:var(--accent); }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
.dot.html{ background:#f08a4b; } .dot.css{ background:#5aa9f5; } .dot.js{ background:#f0c64b; } .dot.text{ background:var(--muted); }
.tab .more{ margin-left:2px; opacity:.7; display:grid; place-items:center; }
.tab.add{ padding:7px 9px; }

/* Main layout */
.main{ flex:1; min-height:0; display:flex; position:relative; }
.pane{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
.pane.off{ display:none; }
.main.wide .pane.editor{ flex:1 1 50%; border-right:1px solid var(--border); }
.main.wide .side{ flex:1 1 50%; min-width:0; display:flex; flex-direction:column; position:relative; }
.main:not(.wide) .side{ display:contents; }

/* Editor */
.editor-area{ position:relative; flex:1; min-height:0; display:flex; background:var(--bg); overflow:hidden; }
.gutter{ flex:none; overflow:hidden; padding:12px 8px 0 10px; text-align:right; color:var(--muted); opacity:.75; user-select:none;
  font:400 var(--fs)/var(--lh) var(--mono); min-width:calc(var(--digits)*1ch + 20px); border-right:1px solid var(--border); background:var(--bg); }
.gutter div{ height:var(--lh); }
.gutter div.on{ color:var(--text); opacity:1; }
.gin{ padding-bottom:160px; }
.code-wrap{ position:relative; flex:1; min-width:0; }
.hl,.ta{ position:absolute; inset:0; margin:0; border:0; padding:12px 16px 160px 12px; white-space:pre; tab-size:2; -moz-tab-size:2;
  font:400 var(--fs)/var(--lh) var(--mono); letter-spacing:0; word-spacing:0; font-variant-ligatures:none; word-wrap:normal; overflow-wrap:normal; }
.hl{ overflow:hidden; pointer-events:none; color:var(--text); }
.ta{ overflow:auto; background:transparent; color:transparent; -webkit-text-fill-color:transparent; caret-color:var(--caret); resize:none; outline:none;
  -webkit-appearance:none; border-radius:0; scrollbar-width:thin; }
.ta::selection{ background:color-mix(in srgb,var(--accent) 35%,transparent); -webkit-text-fill-color:transparent; }
.hl .k{color:var(--s-k)} .hl .s{color:var(--s-s)} .hl .c{color:var(--s-c);font-style:italic} .hl .n{color:var(--s-n)}
.hl .f{color:var(--s-f)} .hl .t{color:var(--s-t)} .hl .a{color:var(--s-a)} .hl .p{color:var(--s-p)} .hl .o{color:var(--s-o)}
.hl .v{color:var(--s-v)} .hl .g{color:var(--s-g)}

/* Quick bar */
.qbar{ flex:none; background:var(--surface); border-top:1px solid var(--border); }
.row{ display:flex; gap:6px; overflow-x:auto; padding:6px 8px; scrollbar-width:none; align-items:center; }
.row::-webkit-scrollbar{ display:none; }
.row.sugg{ min-height:46px; border-bottom:1px solid var(--border); }
.hint{ color:var(--muted); font-size:12px; white-space:nowrap; padding:0 4px; }
.chip{ flex:none; display:flex; align-items:center; gap:7px; height:32px; padding:0 11px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font:500 12.5px var(--mono); }
.chip .ki{ font-size:10px; font-weight:600; color:var(--muted); }
.chip .hn{ color:var(--muted); font-weight:400; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
.chip.emmet{ border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); }
.chip.emmet .ki{ color:var(--accent); }
.key{ flex:none; min-width:34px; height:32px; padding:0 9px; border:0; border-radius:8px; background:var(--surface2); color:var(--text);
  font:500 15px var(--mono); display:grid; place-items:center; }
.key:active,.chip:active{ background:var(--border); }
.key.fn{ color:var(--accent); }
.sep{ flex:none; width:1px; height:18px; background:var(--border); margin:0 2px; }
.status{ flex:none; display:flex; align-items:center; gap:10px; padding:4px 12px; font-size:11px; color:var(--muted); background:var(--bg); border-top:1px solid var(--border); white-space:nowrap; overflow:hidden; }
.status .sp{ flex:1; }
.status .copy{ color:var(--muted); letter-spacing:.01em; }

/* Preview + console */
.bar{ flex:none; display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--surface); border-bottom:1px solid var(--border); }
.url{ flex:1; min-width:0; height:30px; border-radius:9px; background:var(--surface2); color:var(--muted); font:500 12px var(--mono);
  display:flex; align-items:center; padding:0 10px; gap:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.url i{ width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }
.frame{ flex:1; min-height:0; width:100%; border:0; background:#fff; }
.cons{ flex:1; min-height:0; overflow:auto; padding:8px 0; font:400 12.5px/1.5 var(--mono); background:var(--bg); }
.log{ padding:5px 14px; border-bottom:1px solid var(--border); white-space:pre-wrap; word-break:break-word; display:flex; gap:8px; }
.log .g{ flex:none; width:12px; color:var(--muted); }
.log.error{ color:var(--danger); background:color-mix(in srgb,var(--danger) 8%,transparent); }
.log.warn{ color:var(--warn); background:color-mix(in srgb,var(--warn) 8%,transparent); }
.log.result,.log.echo{ color:var(--muted); }
.empty{ padding:36px 24px; text-align:center; color:var(--muted); font:400 13px/1.6 Inter,sans-serif; }
.cin{ flex:none; display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border-top:1px solid var(--border); }
.cin span{ color:var(--accent); font:600 14px var(--mono); }
.cin input{ flex:1; min-width:0; height:34px; border:0; outline:0; background:var(--surface2); color:var(--text); border-radius:9px; padding:0 11px; font:400 16px var(--mono); }

/* Sheets */
.back{ position:fixed; inset:0; z-index:50; background:rgba(8,10,22,.5); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s ease; }
.sheet{ width:100%; max-width:440px; max-height:86%; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow); animation:up .22s cubic-bezier(.2,.8,.2,1); }
@media (min-width:600px){ .back{ align-items:center; } .sheet{ border-radius:20px; } }
.sheet h3{ margin:0 0 12px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
.item{ width:100%; display:flex; align-items:center; gap:12px; padding:12px; border:0; border-radius:12px; background:transparent; color:var(--text); font-size:14px; text-align:left; }
.item:active,.item:hover{ background:var(--surface2); }
.item svg{ color:var(--muted); }
.item.danger{ color:var(--danger); } .item.danger svg{ color:var(--danger); }
.fld{ width:100%; height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); color:var(--text); padding:0 12px; font:500 16px var(--mono); outline:0; }
.fld:focus{ border-color:var(--accent); }
.btns{ display:flex; gap:8px; margin-top:12px; }
.btn{ flex:1; height:42px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:14px; font-weight:600; }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.danger{ color:var(--danger); }
.btn:disabled{ opacity:.4; }
.err{ color:var(--danger); font-size:12px; margin-top:8px; }
.fsz{ display:flex; align-items:center; justify-content:space-between; padding:6px 12px 6px 12px; }
.fsz .ctl{ display:flex; align-items:center; gap:6px; }
.fsz .ctl button{ width:34px; height:34px; border-radius:10px; border:0; background:var(--surface2); color:var(--text); font-weight:600; font-size:15px; }
.fsz .ctl b{ min-width:34px; text-align:center; font:500 13px var(--mono); }
.about{ text-align:center; padding:6px 0 2px; }
.about .logo{ width:56px; height:56px; font-size:28px; border-radius:17px; margin:0 auto 12px; }
.about h4{ margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em; }
.about p{ color:var(--muted); font-size:13px; line-height:1.55; margin:8px 0 0; }
.tips{ text-align:left; margin:16px 0 0; padding:12px; background:var(--surface2); border-radius:12px; font:400 12px/1.9 var(--mono); }
.tips b{ color:var(--accent); font-weight:600; }
.copyr{ margin-top:16px; font-size:12px; color:var(--muted); }

/* Splash */
.splash{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; animation:out .5s ease .9s forwards; }
.splash .logo{ width:64px; height:64px; font-size:32px; border-radius:20px; animation:pop .6s cubic-bezier(.2,.9,.3,1.2); }
.splash b{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
.splash small{ color:var(--muted); font-size:12px; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
@keyframes up{ from{transform:translateY(24px);opacity:0} to{transform:none;opacity:1} }
@keyframes out{ to{opacity:0;visibility:hidden} }
@keyframes pop{ from{transform:scale(.6);opacity:0} to{transform:none;opacity:1} }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; animation-delay:0s !important; } }
button:focus-visible,input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
//#PURE-START
/* ============ Utilidades y tablas ============ */
const MARK = '\u2038'; // marcador de cursor en plantillas
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sp = (c,s) => '<span class="'+c+'">'+esc(s)+'</span>';
const langOf = n => { const e=(n.split('.').pop()||'').toLowerCase();
  return /^(html?|svg|xml)$/.test(e)?'html':e==='css'?'css':/^(js|mjs|cjs|jsx|ts|tsx|json)$/.test(e)?'js':'text'; };
const LANG_LABEL = {html:'HTML',css:'CSS',js:'JavaScript',text:'Texto'};

const JS_KW = new Set('const let var function return if else for while do switch case break continue new this class extends super import export from default async await try catch finally throw typeof instanceof in of delete void yield static get set'.split(' '));
const JS_LIT = new Set(['true','false','null','undefined','NaN','Infinity']);
const JS_GLOB = new Set('console document window Math JSON Object Array String Number Boolean Promise Date Map Set RegExp Error localStorage sessionStorage fetch setTimeout setInterval clearTimeout clearInterval requestAnimationFrame alert parseInt parseFloat navigator location history'.split(' '));

/* ============ Resaltado ============ */
function hlJS(code){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|(`(?:\\[\s\S]|[^`\\])*`?|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b0[xX][\da-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_$][\w$]*)|([=!<>+\-*\/%&|^~?:]+)|(\s+|[\s\S])/g;
  let out='',m,prev='';
  while((m=re.exec(code))){
    if(m[1]){out+=sp('c',m[1]);prev='c';}
    else if(m[2]){out+=sp('s',m[2]);prev='s';}
    else if(m[3]){out+=sp('n',m[3]);prev='n';}
    else if(m[4]){
      const w=m[4]; let cls='';
      if(JS_KW.has(w)&&prev!=='.')cls='k';
      else if(JS_LIT.has(w))cls='n';
      else if(JS_GLOB.has(w)&&prev!=='.')cls='g';
      else if(/^\s*\(/.test(code.slice(re.lastIndex,re.lastIndex+40)))cls='f';
      else if(prev==='.')cls='p';
      out+=cls?sp(cls,w):esc(w); prev=w;
    }
    else if(m[5]){out+=sp('o',m[5]);prev=m[5];}
    else{out+=esc(m[0]); if(!/^\s+$/.test(m[0]))prev=m[0];}
  }
  return out;
}
function selHL(s,pseudo){
  return s.replace(/(\.[\w-]+)|(#[\w-]+)|([\w-]+)|([\s\S])/g,(m,c,i,w)=>c?sp('a',c):i?sp('f',i):w?sp(pseudo?'k':'t',w):esc(m));
}
function valHL(s,fn){
  const re=/(#[0-9a-fA-F]{3,8}\b)|(!important)|(-?(?:\d+\.?\d*|\.\d+)(?:%|[a-zA-Z]+)?)|([a-zA-Z_-][\w-]*)|([\s\S])/g;
  let o='',m;
  while((m=re.exec(s))){
    if(m[1])o+=sp('n',m[1]); else if(m[2])o+=sp('k',m[2]); else if(m[3])o+=sp('n',m[3]);
    else if(m[4])o+=sp(fn&&re.lastIndex===s.length?'f':'v',m[4]);
    else o+=esc(m[0]);
  }
  return o;
}
function hlCSS(code){
  const toks=code.match(/\/\*[\s\S]*?(?:\*\/|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|[{};:]|\([^()]*\)?|[^{};:"'(\/]+|[\s\S]/g)||[];
  let out='',inVal=false,sel=null,prevT='';
  for(let i=0;i<toks.length;i++){
    const t=toks[i],c0=t[0];
    if(c0==='/'&&t[1]==='*'){out+=sp('c',t);continue;}
    if(c0==='"'||c0==="'"){out+=sp('s',t);prevT=t;continue;}
    if(t==='{'||t==='}'||t===';'){out+=sp('o',t);inVal=false;sel=null;prevT=t;continue;}
    if(t===':'){out+=sp('o',t);if(sel===false)inVal=true;prevT=t;continue;}
    if(c0==='('){out+=valHL(t,false);prevT=t;continue;}
    const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(t);
    if(!m[2]){out+=esc(t);continue;}
    if(sel===null){
      sel=false;
      for(let j=i;j<toks.length;j++){const u=toks[j]; if(u==='{'){sel=true;break;} if(u==='}'||u===';')break;}
    }
    let h;
    if(m[2][0]==='@')h=sp('k',m[2]);
    else if(sel===true)h=selHL(m[2],prevT===':');
    else if(inVal)h=valHL(m[2],!!(toks[i+1]&&toks[i+1][0]==='('));
    else h=sp('p',m[2]);
    out+=esc(m[1])+h+esc(m[3]); prevT=t;
  }
  return out;
}
function hlTag(s){
  if(s.startsWith('<!--'))return sp('c',s);
  if(/^<!/.test(s))return sp('k',s);
  const m=/^(<\/?)([\w:-]*)([\s\S]*?)(\/?>)?$/.exec(s);
  if(!m)return esc(s);
  let attrs=m[3].replace(/([^\s=\/"'<>]+)(?:(\s*=\s*)("[^"]*"?|'[^']*'?|[^\s"'>]+))?|(\s+)|([\s\S])/g,
    (x,n,eq,v,ws)=>n?sp('a',n)+(eq?sp('o',eq)+sp('s',v):''):ws?ws:esc(x));
  return sp('o',m[1])+sp('t',m[2])+attrs+(m[4]?sp('o',m[4]):'');
}
function hlHTML(code){
  const re=/(<!--[\s\S]*?(?:-->|$))|(<(script|style)\b[^<>]*>)([\s\S]*?)(<\/\3\s*>|$)|(<\/?[a-zA-Z!][^<>]*>?)|(&[#\w]+;)|([^<&]+|[<&])/gi;
  let out='',m;
  while((m=re.exec(code))){
    if(m[1])out+=sp('c',m[1]);
    else if(m[2])out+=hlTag(m[2])+(m[3].toLowerCase()==='script'?hlJS(m[4]):hlCSS(m[4]))+(m[5]?hlTag(m[5]):'');
    else if(m[6])out+=hlTag(m[6]);
    else if(m[7])out+=sp('n',m[7]);
    else out+=esc(m[8]);
    if(m[0]==='')re.lastIndex++;
  }

const safeJS=c=>c.replace(/<\/script/gi,'<\\/script');
function buildDoc(files){
  const by={}; files.forEach(f=>by[f.name]=f.content);
  const norm=n=>n.replace(/^\.?\//,'');
  const entry=files.find(f=>f.name==='index.html')||files.find(f=>/\.html?$/i.test(f.name));
  let doc;
  if(entry){
    doc=entry.content;
    doc=doc.replace(/<link\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>/gi,(m,h)=>{const k=norm(h); return (/\.css$/i.test(k)&&by[k]!==undefined)?'<style>\n'+by[k]+'\n</style>':m;});
    doc=doc.replace(/<script\b([^>]*?)src\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi,(m,a,h,b)=>{const k=norm(h); return by[k]!==undefined?'<script'+a+b+'>'+safeJS(by[k])+'<\/script>':m;});
    if(/<head[^>]*>/i.test(doc))doc=doc.replace(/<head[^>]*>/i,m=>m+BRIDGE);
    else doc=doc.replace(/^(\s*<!doctype[^>]*>)?/i,m=>m+BRIDGE);
  }else{
    const css=files.filter(f=>langOf(f.name)==='css').map(f=>f.content).join('\n');
    const js=files.filter(f=>/\.(m?js)$/i.test(f.name)).map(f=>safeJS(f.content)).join('\n;');
    doc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+BRIDGE+'<style>'+css+'</style></head><body><script>'+js+'<\/script></body></html>';

}

function replaceRange(ta,from,to,text){
  ta.focus(); ta.setSelectionRange(from,to);
  let ok=false; try{ok=document.execCommand('insertText',false,text);}catch(e){}
  if(!ok||ta.value.slice(from,from+text.length)!==text){ ta.setRangeText(text,from,to,'end'); ta.dispatchEvent(new Event('input',{bubbles:true})); }
}
function applyText(ta,from,to,text){
  let off=text.length; const mi=text.indexOf(MARK);
  if(mi>=0){text=text.slice(0,mi)+text.slice(mi+1);off=mi;}
  replaceRange(ta,from,to,text); ta.setSelectionRange(from+off,from+off);
}
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
function typeChar(ta,ch,lang){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,next=v[e],prev=v[s-1]||'';
  if(s===e){
    if(')]}"\'`'.includes(ch)&&next===ch){ta.setSelectionRange(s+1,s+1);return true;}
    if(PAIRS[ch]){
      if((ch==='"'||ch==="'"||ch==='`')&&/[\w]/.test(prev))return false;
      if(!next||/[\s)\]}>,;]/.test(next)){ applyText(ta,s,e,ch+MARK+PAIRS[ch]); return true; }
    }
    if(ch==='>'&&lang==='html'){
      const m=/<([a-zA-Z][\w:-]*)(?:\s[^<>]*)?$/.exec(v.slice(0,s));
      if(m&&!VOID.has(m[1].toLowerCase())&&!/\/$/.test(v.slice(0,s))&&!v.slice(e).startsWith('</'+m[1])){ applyText(ta,s,e,'>'+MARK+'</'+m[1]+'>'); return true; }
    }
    return false;
  }
  if(PAIRS[ch]&&ch!=="'"){ applyText(ta,s,e,ch+v.slice(s,e)+PAIRS[ch]); return true; }
  return false;
}
function smartEnter(ta,lang){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;
  const ls=v.lastIndexOf('\n',s-1)+1, line=v.slice(ls,s), indent=/^[ \t]*/.exec(line)[0], unit='  ';
  const prev=v[s-1],next=v[e];
  let text,back=0;
  const pairOpen=(prev==='{'&&next==='}')||(prev==='['&&next===']')||(prev==='('&&next===')');
  const tagBetween=lang==='html'&&prev==='>'&&next==='<'&&/<[a-zA-Z][^<>]*>$/.test(line)&&v.slice(e).startsWith('</');
  if(pairOpen||tagBetween){ text='\n'+indent+unit+'\n'+indent; back=1+indent.length; }
  else if(/[{\[(]\s*$/.test(line)||(lang==='html'&&/<([a-zA-Z][\w:-]*)(?:\s[^<>]*)?>$/.test(line)&&!/\/>$/.test(line)&&!VOID.has((/<([a-zA-Z][\w:-]*)[^<>]*>$/.exec(line)||[])[1]||'')&&!/<\/[^>]+>$/.test(line)))text='\n'+indent+unit;
  else text='\n'+indent;
  replaceRange(ta,s,e,text);
  if(back){const p=s+text.length-back; ta.setSelectionRange(p,p);}
}
function indentSel(ta,dir){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,unit='  ';
  if(s===e&&dir>0){replaceRange(ta,s,e,unit);return;}
  const ls=v.lastIndexOf('\n',s-1)+1, block=v.slice(ls,e);

}

      <section className=${'pane editor'+(showEditor?'':' off')}>
        <div className="editor-area" style=${edStyle}>
          <div className="gutter" ref=${gutRef} aria-hidden="true"><div className="gin" dangerouslySetInnerHTML=${{__html:gutHtml}}></div></div>
          <div className="code-wrap">
            <pre className="hl" ref=${hlRef} aria-hidden="true" dangerouslySetInnerHTML=${{__html:hlHtml}}></pre>
            <textarea className="ta" ref=${taRef} wrap="off" spellCheck=${false} autoCapitalize="off" autoCorrect="off" autoComplete="off"
              data-gramm="false" aria-label=${'Editor de '+file.name} onInput=${onInput} onScroll=${onScroll} onKeyDown=${onKeyDown}
              onClick=${e=>setCaret(e.target.selectionStart)} onFocus=${e=>setCaret(e.target.selectionStart)}></textarea>
          </div>
        </div>
        <div className="qbar">
          <div className="row sugg" role="listbox" aria-label="Sugerencias">
            ${sugg.length?sugg.map((s,i)=>html`<button key=${s.kind+s.label+i} className=${'chip'+(s.kind==='emmet'?' emmet':'')} onPointerDown=${noFocus} onClick=${()=>applySugg(s)}>
              <span className="ki">${KIND_LBL[s.kind]}</span><span>${s.label}</span>${s.hint&&html`<span className="hn">${s.hint}</span>`}
            </button>`):html`<span className="hint">${lang==='html'?'Prueba Emmet: ul>li*3 y toca ⚡':lang==='css'?'Prueba Emmet: df, m10-20, w100p':lang==='js'?'Escribe log, fn o qs para ver atajos':'Sin sugerencias para este tipo de archivo'}</span>`}
          </div>
          <div className="row" aria-label="Símbolos">
            <button className="key fn" onPointerDown=${noFocus} onClick=${()=>{taRef.current.focus();if(!doEmmet())indentSel(taRef.current,1);}} aria-label="Expandir Emmet o sangría"><${Icon} n="zap" s=${15}/></button>
            <button className="key" onPointerDown=${noFocus} onClick=${()=>insertKey('\t')}>⇥</button>
            <button className="key" onPointerDown=${noFocus} onClick=${()=>indentSel(taRef.current,-1)}>⇤</button>
            <button className="key" onPointerDown=${noFocus} onClick=${()=>exec('undo')} aria-label="Deshacer"><${Icon} n="undo" s=${15}/></button>
            <button className="key" onPointerDown=${noFocus} onClick=${()=>exec('redo')} aria-label="Rehacer"><${Icon} n="redo" s=${15}/></button>
            <span className="sep"></span>
            ${'< > / { } ( ) [ ] " \' ` = ; : . , # $ ! & | + - * _ \\ ? %'.split(' ').map(k=>html`<button key=${k} className="key" onPointerDown=${noFocus} onClick=${()=>insertKey(k)}>${k}</button>`)}
          </div>
        </div>
        <div className="status">
          <span>Ln ${cur}, Col ${col}</span><span>${LANG_LABEL[lang]}</span><span>${fs}px</span><span className="sp"></span>
          <span className="copy">© 2026 León Studio</span>
        </div>
      </section>

      <div className="side">
        <section className=${'pane'+(showPrev?'':' off')}>
          <div className="bar">
            <div className="url"><i></i>vista-previa · ${(files.find(f=>f.name==='index.html')||files.find(f=>/\.html?$/i.test(f.name))||{name:'sin html'}).name}</div>
            <button className="ibtn" onClick=${run} aria-label="Recargar vista previa"><${Icon} n="refresh" s=${16}/></button>
          </div>
          <iframe key=${runId} ref=${frameRef} className="frame" title="Vista previa" srcDoc=${srcdoc}
            sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        </section>
        <section className=${'pane'+(showCons?'':' off')}>
          <div className="bar">
            <div className="url"><i></i>consola · ${logs.length} mensajes</div>
            <button className="ibtn" onClick=${()=>setLogs([])} aria-label="Limpiar consola"><${Icon} n="trash" s=${16}/></button>
          </div>
          <div className="cons" ref=${consRef}>
            ${logs.length?logs.map(l=>html`<div key=${l.id} className=${'log '+l.type}><span className="g">${l.type==='error'?'✕':l.type==='warn'?'!':l.type==='result'?'←':l.type==='echo'?'':'›'}</span><span>${l.text}</span></div>`)
              :html`<div className="empty">Aquí aparecen los console.log y los errores de tu código.<br/>También puedes escribir JavaScript abajo para probarlo en la vista previa.</div>`}
          </div>
          <div className="cin"><span>›</span>
            <input value=${cmd} onChange=${e=>setCmd(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')sendCmd();}} placeholder="Escribe JavaScript…" autoCapitalize="off" autoCorrect="off" spellCheck=${false} aria-label="Consola interactiva"/>
            <button className="ibtn" onClick=${sendCmd} aria-label="Enviar"><${Icon} n="send" s=${16}/></button>
          </div>
        </section>
      </div>
    </div>

    ${sheet==='menu'&&html`<${Sheet} title="Opciones" onClose=${()=>setSheet(null)}>
      <button className="item" onClick=${()=>{setSheet('new');}}><${Icon} n="plus"/>Nuevo archivo</button>
      <div className="fsz"><span style=${{display:'flex',alignItems:'center',gap:12,fontSize:14}}><${Icon} n="type"/>Tamaño de letra</span>
        <span className="ctl"><button onClick=${()=>setFs(v=>Math.max(11,v-1))} aria-label="Reducir">−</button><b>${fs}</b><button onClick=${()=>setFs(v=>Math.min(22,v+1))} aria-label="Aumentar">+</button></span></div>
      <button className="item" onClick=${()=>{setTheme(t=>t==='dark'?'light':'dark');}}><${Icon} n=${theme==='dark'?'sun':'moon'}/>${theme==='dark'?'Tema claro':'Tema oscuro'}</button>
      <button className="item" onClick=${()=>setSheet('about')}><${Icon} n="info"/>Atajos y acerca de</button>
      <button className="item danger" onClick=${resetProject}><${Icon} n="reset"/>Restablecer proyecto de ejemplo</button>
    <//>`}
    ${sheet==='new'&&html`<${NameSheet} title="Nuevo archivo" initial="archivo.js" files=${files} onSave=${createFile} onClose=${()=>setSheet(null)}/>`}
    ${sheet==='file'&&html`<${NameSheet} title="Archivo" initial=${file.name} selfId=${file.id} files=${files} onSave=${renameFile} onDelete=${deleteFile} onClose=${()=>setSheet(null)}/>`}
    ${sheet==='about'&&html`<${Sheet} title="Acerca de" onClose=${()=>setSheet(null)}>
      <div className="about">
        <div className="logo">L</div>
        <h4>León IDE</h4>
        <p>Editor de código para el celular con resaltado, sugerencias, Emmet y ejecución en vivo de HTML, CSS y JavaScript.</p>
        <div className="tips">
          <div><b>HTML</b> div.card>h1+p → toca ⚡</div>
          <div><b>HTML</b> ! → documento completo</div>
          <div><b>HTML</b> ul>li.item$*3 → lista numerada</div>
          <div><b>CSS</b> df, jcc, aic → flexbox</div>
          <div><b>CSS</b> m10-20, w100p, bgc#222</div>
          <div><b>JS</b> log, fn, qs, ael → fragmentos</div>
          <div><b>Teclado</b> Tab expande · Ctrl+Enter ejecuta</div>
        </div>
        <div className="copyr">© 2026 León Studio. Todos los derechos reservados.</div>
      </div><//>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
